<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gambit — Play, review & scout chess</title>
    <meta
      name="description"
      content="Gambit is a chess desk for tournament players: play bots or online, review your games with Stockfish, and scout opponents from their real games."
    />
    <link rel="icon" href="/assets/pieces/cburnett/wN.svg" type="image/svg+xml" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gambit — Play, review & scout chess" />
    <meta
      property="og:description"
      content="Play, review your games with a real engine, and scout your next opponent from their real games."
    />
    <meta property="og:image" content="/assets/pieces/cburnett/wN.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gambit — Play, review & scout chess" />
    <meta
      name="twitter:description"
      content="A chess desk for tournament players: play, engine review, and opponent scouting."
    />

    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/board.css" />
    <link rel="stylesheet" href="/styles/screens.css" />
    <link rel="stylesheet" href="/styles/analysis.css" />
    <link rel="stylesheet" href="/styles/study.css" />
    <link rel="stylesheet" href="/styles/trackers.css" />

    <!-- chess.js is loaded as an ES module from a CDN via this import map, so the
         client and server share the same rules engine with no build step. -->
    <script type="importmap">
      {
        "imports": {
          "chess.js": "https://esm.sh/chess.js@1.0.0"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Left rail (Tournament desk). Nav + account are rendered in main.js. -->
      <aside class="sidebar" id="sidebar" data-open="false">
        <a class="sb-brand" href="#/menu">
          <span class="sb-logo"><img src="/assets/pieces/cburnett/wN.svg" alt="" /></span>
          <span class="sb-word">
            <span class="sb-word-main tourney-display">Gambit</span>
            <span class="sb-word-sub">Tournament desk</span>
          </span>
        </a>
        <div class="sb-section-label">Prepare</div>
        <nav class="sb-nav" id="sidebar-nav"></nav>
        <div class="sb-foot" id="sidebar-foot"></div>
      </aside>

      <button class="sb-scrim" id="sidebar-scrim" aria-label="Close menu" hidden></button>

      <div class="app-main">
        <header class="topbar">
          <button class="sb-toggle" id="sidebar-toggle" aria-label="Open navigation">
            <i data-lucide="menu"></i>
          </button>
          <a class="topbar-brand tourney-display" href="#/menu">Gambit</a>
          <div class="topbar-spacer"></div>
        </header>
        <main id="app"></main>
      </div>
    </div>

    <!-- Lucide icons (UMD, sets window.lucide); createIcons() is called after each screen render. -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.8.1/index.min.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
