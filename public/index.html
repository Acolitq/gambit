<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gambit — Play Chess</title>
    <meta
      name="description"
      content="A clean, simple chess app. Play against bots at five levels or get matched with a random opponent online."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/board.css" />
    <link rel="stylesheet" href="/styles/screens.css" />
    <link rel="stylesheet" href="/styles/analysis.css" />
    <link rel="stylesheet" href="/styles/study.css" />

    <!-- chess.js is loaded as an ES module from a CDN via this import map, so the
         client and server share the same rules engine with no build step. -->
    <script type="importmap">
      {
        "imports": {
          "chess.js": "https://esm.sh/chess.js@1.0.0"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="topbar-brand" href="#/menu">Gambit</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <i data-lucide="moon"></i>
      </button>
    </header>

    <main id="app"></main>

    <!-- Lucide icons (UMD, sets window.lucide); createIcons() is called after each screen render. -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.8.1/index.min.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
