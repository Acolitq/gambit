<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gambit — Play Chess</title>
    <meta
      name="description"
      content="A clean, simple chess app. Play against bots at five levels or get matched with a random opponent online."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/board.css" />
    <link rel="stylesheet" href="/styles/screens.css" />

    <!-- chess.js is loaded as an ES module from a CDN via this import map, so the
         client and server share the same rules engine with no build step. -->
    <script type="importmap">
      {
        "imports": {
          "chess.js": "https://esm.sh/chess.js@1.0.0"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="topbar-brand" href="#/menu">Gambit</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">◐</button>
    </header>

    <main id="app"></main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
